apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: data-services
  labels:
    app: redis
    policy: network-segmentation
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow access from API pods
    - from:
        - namespaceSelector:
            matchLabels:
              name: rec-engine
      ports:
        - protocol: TCP
          port: 6379
    # Allow access from stream processing pods
    - from:
        - namespaceSelector:
            matchLabels:
              name: rec-engine
        - podSelector:
            matchLabels:
              app: stream-processor
      ports:
        - protocol: TCP
          port: 6379
    # Allow access from monitoring for health checks
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # No external egress for Redis