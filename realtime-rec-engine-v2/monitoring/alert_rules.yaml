groups:
  - name: rec-engine-critical
    interval: 30s
    rules:
      # ─── Authentication & Authorization ──────────────────────────────
      - alert: RecEngineHighAuthFailures
        expr: |
          sum(rate(rec_engine_auth_failures_total[5m])) by (reason, endpoint) > 5
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High authentication failure rate"
          description: |
            Authentication failures for {{ $labels.reason }} on {{ $labels.endpoint }} 
            exceed 5/min (current: {{ $value | humanize }}/min)
          runbook_url: "https://runbooks.example.com/auth-failures"

      - alert: RecEngineHighAuthzDenials
        expr: |
          sum(rate(rec_engine_authz_denials_total[5m])) by (endpoint, required_scope) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High authorization denial rate"
          description: |
            Authorization denials for {{ $labels.required_scope }} on {{ $labels.endpoint }} 
            exceed 10/min (current: {{ $value | humanize }}/min)

      - alert: RecEngineRateLimitExceeded
        expr: |
          sum(rate(rec_engine_rate_limit_exceeded_total[5m])) by (scope, endpoint) > 100
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Rate limit exceeded spike"
          description: |
            Rate limit exceeded for {{ $labels.scope }} on {{ $labels.endpoint }} 
            ({{ $value | humanize }}/min)

      # ─── Latency SLOs ────────────────────────────────────────────────
      - alert: RecEngineHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(rec_engine_request_latency_seconds_bucket[5m])) by (le, endpoint)) > 0.2
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High p95 latency"
          description: |
            p95 latency for {{ $labels.endpoint }} is {{ $value | humanizeDuration }} 
            (SLO: < 200ms)
          runbook_url: "https://runbooks.example.com/high-latency"

      - alert: RecEngineHighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(rec_engine_request_latency_seconds_bucket[5m])) by (le, endpoint)) > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High p99 latency"
          description: |
            p99 latency for {{ $labels.endpoint }} is {{ $value | humanizeDuration }} 
            (SLO: < 500ms)

      - alert: RecEngineRecommendationHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(rec_engine_recommendation_latency_seconds_bucket[5m])) by (le, cache_hit)) > 0.1
        for: 5m
        labels:
          severity: critical
          team: ml-platform
        annotations:
          summary: "High recommendation generation latency"
          description: |
            p95 recommendation latency is {{ $value | humanizeDuration }} 
            (SLO: < 100ms), cache_hit={{ $labels.cache_hit }}

      # ─── Error Rates ────────────────────────────────────────────────
      - alert: RecEngineHighErrorRate
        expr: |
          sum(rate(rec_engine_errors_total[5m])) by (endpoint, error_type) 
          / sum(rate(rec_engine_requests_total[5m])) by (endpoint) > 0.01
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High error rate"
          description: |
            Error rate for {{ $labels.endpoint }} ({{ $labels.error_type }}) is 
            {{ $value | humanizePercentage }} (SLO: < 1%)

      - alert: RecEngineValidationErrors
        expr: |
          sum(rate(rec_engine_validation_errors_total[5m])) by (endpoint, field) > 50
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High validation error rate"
          description: |
            Validation errors for field {{ $labels.field }} on {{ $labels.endpoint }} 
            exceed 50/min

      # ─── Circuit Breaker ────────────────────────────────────────────
      - alert: RecEngineCircuitBreakerOpen
        expr: |
          rec_engine_circuit_breaker_state > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Circuit breaker open"
          description: |
            Circuit breaker for {{ $labels.endpoint }} is {{ $value | humanize }}
            (0=closed, 1=half-open, 2=open)

      # ─── Cache Performance ──────────────────────────────────────────
      - alert: RecEngineLowCacheHitRate
        expr: |
          sum(rate(rec_engine_cache_hits_total[5m])) by (cache_type, endpoint)
          / (sum(rate(rec_engine_cache_hits_total[5m])) by (cache_type, endpoint) 
           + sum(rate(rec_engine_cache_misses_total[5m])) by (cache_type, endpoint)) < 0.6
        for: 10m
        labels:
          severity: warning
          team: ml-platform
        annotations:
          summary: "Low cache hit rate"
          description: |
            Cache hit rate for {{ $labels.cache_type }} on {{ $labels.endpoint }} is 
            {{ $value | humanizePercentage }} (target: > 60%)

      # ─── Index/Model ────────────────────────────────────────────────
      - alert: RecEngineIndexBuildDuration
        expr: |
          histogram_quantile(0.95, sum(rate(rec_engine_index_build_duration_seconds_bucket[1h])) by (le, index_type)) > 1800
        for: 0m
        labels:
          severity: warning
          team: ml-platform
        annotations:
          summary: "Index build duration exceeded"
          description: |
            {{ $labels.index_type }} index build took {{ $value | humanizeDuration }} 
            (target: < 30 min)

      - alert: RecEngineIndexQueryLatency
        expr: |
          histogram_quantile(0.95, sum(rate(rec_engine_index_query_latency_seconds_bucket[5m])) by (le, index_type)) > 0.05
        for: 5m
        labels:
          severity: warning
          team: ml-platform
        annotations:
          summary: "High ANN index query latency"
          description: |
            p95 index query latency for {{ $labels.index_type }} is {{ $value | humanizeDuration }}

      # ─── System Health ──────────────────────────────────────────────
      - alert: RecEngineHighQueueDepth
        expr: |
          rec_engine_queue_depth > 10000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High background queue depth"
          description: |
            Queue {{ $labels.queue_name }} depth is {{ $value | humanize }}

      - alert: RecEngineLowAvailability
        expr: |
          rec_engine_slo_availability < 0.999
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Availability below SLO"
          description: |
            Availability for {{ $labels.endpoint }} is {{ $value | humanizePercentage }} 
            (SLO: 99.9%)

      - alert: RecEngineHighActiveConnections
        expr: |
          rec_engine_active_connections > 10000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High active connections"
          description: |
            Active connections: {{ $value | humanize }}

  - name: rec-engine-business
    interval: 60s
    rules:
      # ─── Business Metrics ───────────────────────────────────────────
      - alert: RecEngineLowActiveUsers
        expr: |
          rec_engine_active_users < 100
        for: 10m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "Low active users"
          description: |
            Active users dropped to {{ $value | humanize }} (expected > 100)

      - alert: RecEngineExperimentAssignmentSkew
        expr: |
          sum(rate(rec_engine_experiment_assignments_total[5m])) by (experiment_id, variant) 
          / sum(rate(rec_engine_experiment_assignments_total[5m])) by (experiment_id) > 0.6
        for: 10m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "Experiment assignment skew detected"
          description: |
            Variant {{ $labels.variant }} of experiment {{ $labels.experiment_id }} 
            receives {{ $value | humanizePercentage }} of traffic (expected ~50%)

      - alert: RecEngineModelVersionStale
        expr: |
          time() - rec_engine_model_version > 86400
        for: 1h
        labels:
          severity: warning
          team: ml-platform
        annotations:
          summary: "Model version not updated"
          description: |
            Model {{ $labels.model_name }} version {{ $labels.version }} 
            hasn't been updated in 24h

  - name: rec-engine-infra
    interval: 30s
    rules:
      # ─── Infrastructure (requires node_exporter, kube-state-metrics) ────
      - alert: RecEnginePodNotReady
        expr: |
          kube_pod_status_ready{namespace="rec-engine", condition="true"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Rec-engine pod not ready"
          description: |
            Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not ready

      - alert: RecEnginePodRestarting
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="rec-engine"}[15m]) > 2
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Rec-engine pod restarting frequently"
          description: |
            Pod {{ $labels.pod }} restarted {{ $value | humanize }} times in 15 minutes

      - alert: RecEngineHighMemoryUsage
        expr: |
          (container_memory_usage_bytes{namespace="rec-engine"} / container_spec_memory_limit_bytes{namespace="rec-engine"}) > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage"
          description: |
            Container {{ $labels.container }} in pod {{ $labels.pod }} 
            memory usage at {{ $value | humanizePercentage }}

      - alert: RecEngineHighCPUUsage
        expr: |
          (sum(rate(container_cpu_usage_seconds_total{namespace="rec-engine"}[5m])) by (pod) 
           / sum(container_spec_cpu_quota{namespace="rec-engine"}/container_spec_cpu_period{namespace="rec-engine"}) by (pod)) > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage"
          description: |
            Pod {{ $labels.pod }} CPU usage at {{ $value | humanizePercentage }}

      - alert: RecEngineDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Disk space low"
          description: |
            Disk space on {{ $labels.instance }} is {{ $value | humanizePercentage }} free